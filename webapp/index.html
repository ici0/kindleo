<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport meta disabled for Kindle compatibility -->
    <title>Kindle-leo Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content-container">
        <img id="checkMark" src="svg/check.svg" alt="Check Mark">
        <div id="word" class="word"></div>
        <div class="buttons">
            <button id="forgotBtn">I forgot</button>
            <button id="knowBtn">I know</button>
        </div>
        <div id="answer"></div>
        <div id="context" class="context"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
